# Yomizaka dev — DigitalOcean App Platform, project `yomizaka`, region tor (next to the cluster krizaka-dev-pg).
# The smallest service ($5/month). Secrets are filled at apply time (`__NAME__`, never committed) and stored as SECRET.
name: yomizaka-dev
region: tor
alerts:
  - rule: DEPLOYMENT_FAILED
domains:
  # The public address (epic krizaka/.github#119): www is primary and indexed, the apex answers 308 with www (ingress below).
  - domain: www.yomizaka.com
    type: PRIMARY
  - domain: yomizaka.com
    type: ALIAS
  # The development address: every page goes to www (308); the API, .well-known and healthz keep serving, noindex (APP_DEV_HOST).
  - domain: dev.yomizaka.com
    type: ALIAS
  - domain: admin.yomizaka.com
    type: ALIAS
# The apex leads to www (308); the other hosts are the app's (dev's page redirect and noindex are the app's own: lib/indexing.ts).
ingress:
  rules:
    - match:
        authority:
          exact: yomizaka.com
      redirect:
        authority: www.yomizaka.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    github:
      repo: krizaka/yomizaka
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - { key: APP_PUBLIC_URL, scope: RUN_AND_BUILD_TIME, value: "https://www.yomizaka.com" }
      - { key: APP_DEV_HOST, scope: RUN_TIME, value: "dev.yomizaka.com" }
      # www is indexed (krizaka-com AGENTS §2.4): robots allows, sitemap, no noindex. dev. and admin. are closed by host (lib/indexing.ts).
      - { key: APP_SEARCH_INDEXING, scope: RUN_AND_BUILD_TIME, value: "on" }
      - { key: APP_COMMIT_SHA, scope: BUILD_TIME, value: "${_self.COMMIT_HASH}" }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "__DATABASE_URL__" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: "__DATABASE_CA_CERT__" }
      - { key: AUTH_SESSION_SECRET, scope: RUN_TIME, type: SECRET, value: "__AUTH_SESSION_SECRET__" }
      - { key: AUTH_SIGNUP_ENABLED, scope: RUN_TIME, value: "false" }
      - { key: AUTH_ALLOWED_IPS, scope: RUN_TIME, type: SECRET, value: "__AUTH_ALLOWED_IPS__" }
      - { key: ABUSE_CLIENT_IP_HEADER, scope: RUN_TIME, value: "do-connecting-ip" }
      - { key: AI_PROVIDER, scope: RUN_TIME, value: "orazaka" }
      - { key: AI_API_URL, scope: RUN_TIME, value: "https://dev.orazaka.com/edge" }
      - { key: AI_API_KEY, scope: RUN_TIME, type: SECRET, value: "__AI_API_KEY__" }
