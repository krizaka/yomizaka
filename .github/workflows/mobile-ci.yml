# The Yomizaka app (apps/mobile): the org's reusable Expo pipeline (krizaka/.github expo-ci.yml, ADR-004) and the Maestro flows
# on an Android emulator (mobile-e2e.yml, krizaka/.github#241). On every pull request: the changes gate inside each skips the
# heavy jobs when neither the app, the contracts it reads nor these workflows changed, and the gates always report (so
# `mobile-e2e / gate` can be a required check). Lint, types, tests and the bundle export run side by side.
name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/expo-ci.yml@5a6ae3ac28625b1dd1d1468ca31b44dddd133094 # main, with lockfile-directory (krizaka/.github#182)
    with:
      package-manager: pnpm
      working-directory: apps/mobile
      lockfile-directory: .
      install-command: pnpm install --frozen-lockfile
      relevant: '^(apps/mobile/|packages/(core|client)/|pnpm-lock\.yaml$|\.github/workflows/mobile-ci\.yml$)'
      extra-scripts: |
        export

  # The flows of apps/mobile/.maestro on an Android emulator, signed in as the seeded persona Éric against a throwaway
  # backend (scripts/ci-mobile-backend.sh). The check is `mobile-e2e / gate`.
  mobile-e2e:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/mobile-e2e.yml@274094c6ea47f88d759ef6da0a4aaeafd0d2dfb2 # main (krizaka/.github#312)
    with:
      app-id: com.krizaka.yomizaka
      app-directory: apps/mobile
      package-manager: pnpm
      lockfile-directory: .
      install-command: pnpm install --frozen-lockfile
      demo-email: eric@demo.yomizaka.test
      setup-command: bash scripts/ci-mobile-backend.sh
      reverse-ports: "3000"
      allow-cleartext: true
      relevant: '^(apps/(mobile|web)/|packages/|pnpm-lock\.yaml$|scripts/(ci-mobile-backend\.sh|demo-seed/|demo-documents/)|\.github/workflows/mobile-ci\.yml$)'
      env: |
        EXPO_PUBLIC_APP_URL=http://localhost:3000
        EXPO_PUBLIC_APP_ENV=dev

  # The web videos of the download page (krizaka/.github#315), recorded by the e2e tests themselves on the seeded persona Éric:
  # the same throwaway backend as the phone's flows, the showcase journeys of scripts/showcase-web.mjs (the binder, the report),
  # then the org's `app-videos` workflow transcodes, uploads to Bunny and opens one PR with apps/web/content/app-videos.json.
  # On main only, after the checks are green; a failure here never blocks a merge (it is not a required check).
  showcase-web:
    name: Showcase videos (web)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: The demo persona (masked, for this run only) and its backend
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "DEMO_ACCOUNT_EMAIL=eric@demo.yomizaka.test" >> "$GITHUB_ENV"
          echo "DEMO_ACCOUNT_PASSWORD=$password" >> "$GITHUB_ENV"
          DEMO_ACCOUNT_EMAIL=eric@demo.yomizaka.test DEMO_ACCOUNT_PASSWORD="$password" bash scripts/ci-mobile-backend.sh
      - name: Record the journeys
        run: E2E_EMAIL="$DEMO_ACCOUNT_EMAIL" E2E_PASSWORD="$DEMO_ACCOUNT_PASSWORD" node scripts/showcase-web.mjs showcase-web --base http://localhost:3000 --locale fr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-web
          path: showcase-web
          retention-days: 7

  # The phone's video: a second call of the Maestro workflow, never required, so it can not block `mobile-e2e / gate`. Its flows are
  # in apps/mobile/.maestro-showcase (startRecording / stopRecording); the whole-run recorder is off (two recorders fight).
  mobile-showcase:
    name: Showcase video (phone)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile-e2e
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/mobile-e2e.yml@eabd6ab14d91febe8e0ebd7bfba6be98df5ae492 # main (krizaka/.github#318)
    with:
      app-id: com.krizaka.yomizaka
      app-directory: apps/mobile
      flows-directory: .maestro-showcase
      artifact-name: maestro-showcase
      screen-recording: false
      package-manager: pnpm
      lockfile-directory: .
      install-command: pnpm install --frozen-lockfile
      demo-email: eric@demo.yomizaka.test
      setup-command: bash scripts/ci-mobile-backend.sh
      reverse-ports: "3000"
      allow-cleartext: true
      env: |
        EXPO_PUBLIC_APP_URL=http://localhost:3000
        EXPO_PUBLIC_APP_ENV=dev

  app-videos:
    name: Download page videos
    needs: [showcase-web, mobile-showcase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/app-videos.yml@d96437b6681524d470ca5050f91c1961a45c5906 # main (krizaka/.github#316)
    with:
      product: yomizaka
      manifest: apps/web/content/app-videos.json
      artifacts: |
        showcase-web
        maestro-showcase
    secrets: inherit
