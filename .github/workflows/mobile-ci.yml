# The Yomizaka app (apps/mobile): the org's reusable Expo pipeline (krizaka/.github expo-ci.yml, ADR-004) and the Maestro flows
# on an Android emulator (mobile-e2e.yml, krizaka/.github#241). On every pull request: the changes gate inside each skips the
# heavy jobs when neither the app, the contracts it reads nor these workflows changed, and the gates always report (so
# `mobile-e2e / gate` can be a required check). Lint, types, tests and the bundle export run side by side.
name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/expo-ci.yml@3f78a2d25b154a21cabbc5d57b8278f6b1ddf0f1 # main (merge queue, layout guard)
    with:
      package-manager: pnpm
      working-directory: apps/mobile
      lockfile-directory: .
      install-command: pnpm install --frozen-lockfile
      relevant: '^(apps/mobile/|packages/(core|client)/|pnpm-lock\.yaml$|\.github/workflows/mobile-ci\.yml$)'
      extra-scripts: |
        export

  # The flows of apps/mobile/.maestro on an Android emulator, signed in as the seeded persona Éric against a throwaway
  # backend (scripts/ci-mobile-backend.sh). The check is `mobile-e2e / gate`.
  mobile-e2e:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/mobile-e2e.yml@3f78a2d25b154a21cabbc5d57b8278f6b1ddf0f1 # main (merge queue, layout guard)
    with:
      app-id: com.krizaka.yomizaka
      app-directory: apps/mobile
      package-manager: pnpm
      lockfile-directory: .
      install-command: pnpm install --frozen-lockfile
      demo-email: eric@demo.yomizaka.test
      setup-command: bash scripts/ci-mobile-backend.sh
      reverse-ports: "3000"
      allow-cleartext: true
      relevant: '^(apps/(mobile|web)/|packages/|pnpm-lock\.yaml$|scripts/(ci-mobile-backend\.sh|demo-seed/|demo-documents/)|\.github/workflows/mobile-ci\.yml$)'
      env: |
        EXPO_PUBLIC_APP_URL=http://localhost:3000
        EXPO_PUBLIC_APP_ENV=dev
