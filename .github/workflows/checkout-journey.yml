# The checkout journey on the deployed dev (verikora P0, 2026-10-30): a persona buys a plan with Stripe's TEST card, the subscription turns
# active, the receipt opens and the signed PDF is reachable. Every day and on demand, on main only (the persona and the TEST key are the
# `dev` environment's, which pull request refs may not use). Never required, so it cannot block a merge. A red run on main files an issue
# (scripts/checkout-journey-report.mjs + the shared alert-issue action, in krizaka-internal; tested by scripts/checkout-journey.test.mjs). Dev deploys on every push to main (6-10 min): run it by
# hand after a deploy that touches billing.
# Environment `dev`: SMOKE_EMAIL / SMOKE_PASSWORD (the persona) and PAYMENTS_STRIPE_TEST_SECRET_KEY (an sk_test_ key, refused otherwise).
name: Checkout journey

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    name: Buy a plan on dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: The persona buys a plan with the TEST card
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          PAYMENTS_STRIPE_TEST_SECRET_KEY: ${{ secrets.PAYMENTS_STRIPE_TEST_SECRET_KEY }}
        run: node scripts/checkout-journey.mjs --base https://dev.verikora.com 2>&1 | tee checkout-journey.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # Where the page was stuck (address without secrets, title, screenshot): kept a few days, for whoever reads the red run.
      - name: Keep the diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkout-journey-diagnosis
          path: journey-diagnosis
          retention-days: 3
          if-no-files-found: ignore
      # Fail-on-main: one issue (or a comment on the open one) says the checkout is red. It is filed in the private krizaka-internal with
      # the org app token, never in this public repository (krizaka-internal#2267).
      - name: Write the report
        if: failure()
        run: |
          JOURNEY_FAILURE="$(grep -m1 'FAILED' checkout-journey.log || echo 'the journey stopped before it could say why')"
          export JOURNEY_FAILURE
          node scripts/checkout-journey-report.mjs "$RUNNER_TEMP/journey.md"
        shell: bash
      - name: Open the issue
        if: failure()
        uses: krizaka/.github/actions/alert-issue@a888de63a6049d329d7a8522c8d50af62a0f6350 # main
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          title: "verikora · fix(checkout): a persona cannot buy a plan on dev (the checkout journey is red on main)"
          body-file: ${{ runner.temp }}/journey.md
          labels: repo:verikora,type:fix
