name: CI
# main is protected by a merge queue (merge_group below): a pull request merges only after CI passes on its entry.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright
  # caches, parallel legs, the timeouts and the gate that always reports live there. This file says only what is Yomizaka's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@58d71a2cacfa1563a74aab117bc6a1db75821b87 # main (merge queue, layout guard)
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # SonarCloud CI analysis after the tests, with the coverage of every package (krizaka/.github#237).
      sonar: true
      sonar-coverage-paths: |
        coverage/lcov.info
        apps/*/coverage/lcov.info
        packages/*/coverage/lcov.info
      test-script: test:coverage
      container: true      # the image is built on every PR that can break it (Dockerfile, manifests, lockfiles, COPY paths)
      container-dockerfile: deploy/docker/Dockerfile
      container-image: app:ci
      container-smoke: scripts/ci-container-smoke.sh   # the photo stack (sharp, HEIC, Tesseract) runs inside the image, at 512 MB
      # What App Platform passes as build arguments: indexing off (a dev build), a placeholder commit.
      container-build-args: |
        APP_SEARCH_INDEXING=off
        APP_COMMIT_SHA=ci
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      package-manager: pnpm
      parallel: true
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: yomizaka_db
      # Test values only — no real secret anywhere.
      env: |
        DATABASE_URL=postgresql://yomizaka_db:ci-only-password@localhost:5432/yomizaka_db
        YOMIZAKA_DB_IT=1
      playwright: chromium
      after-build: scripts/ci-after-build.sh

  # The S3 adapter against a real S3-compatible server (a throwaway SeaweedFS), never skipped: STORAGE_IT_S3_REQUIRED makes the
  # tests fail if their variables are missing (ADR-0007, krizaka/yomizaka#198). Test values only — no real secret.
  storage-s3:
    name: Storage (S3, SeaweedFS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      STORAGE_IT_S3_ENDPOINT: http://localhost:8333
      STORAGE_IT_S3_USER: ci-s3-user
      STORAGE_IT_S3_PASS: ci-only-s3-password
      STORAGE_IT_S3_BUCKET: yomizaka-it
      STORAGE_IT_S3_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash scripts/ci-s3.sh
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @yomizaka/web exec vitest run lib/storage/s3.test.ts
