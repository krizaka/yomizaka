name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright
  # caches, parallel legs, the timeouts and the gate that always reports live there. This file says only what is Yomizaka's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    permissions:
      contents: read
    with:
      package-manager: pnpm
      parallel: true
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: yomizaka_db
      # Test values only — no real secret anywhere.
      env: |
        DATABASE_URL=postgresql://yomizaka_db:ci-only-password@localhost:5432/yomizaka_db
        YOMIZAKA_DB_IT=1
      playwright: chromium
      after-build: scripts/ci-after-build.sh

  # The job name is the required status check on main: kept by a shim that reads the gate's verdict.
  verify:
    name: Lint · Typecheck · Tests · Build
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
