name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright
  # caches, parallel legs, the timeouts and the gate that always reports live there. This file says only what is Yomizaka's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@1cb2e1b6f572ba712083cb6f05fd041370c5ea0b # v1.5.0
    permissions:
      contents: read
    with:
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      package-manager: pnpm
      parallel: true
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: yomizaka_db
      # Test values only — no real secret anywhere.
      env: |
        DATABASE_URL=postgresql://yomizaka_db:ci-only-password@localhost:5432/yomizaka_db
        YOMIZAKA_DB_IT=1
      playwright: chromium
      after-build: scripts/ci-after-build.sh
