name: Journeys

# The customer journeys (ADR-017, krizaka/.github#423) as the seeded cast: apps/web/e2e/journeys/journeys.json lists them, the
# kit is @krizaka/page-audit/journey. The same app, seed and Playwright container as the visual regression; retries are 0 and
# a flake is a bug. Not a required check until it has been green for a week on main (the CTO's call).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  journeys:
    uses: krizaka/.github/.github/workflows/visual-regression.yml@b53d9fa9dc1c759d7a27709059dc99f867c63e5b # main (group-suffix, .github#434)
    permissions:
      contents: read
    with:
      package-manager: pnpm
      group-suffix: -journeys
      start-script: scripts/ci-visual-start.sh
      test-command: pnpm exec playwright test -c apps/web/e2e/journeys/playwright.config.mjs
      snapshot-paths: apps/web/e2e/journeys
      env: |
        E2E_EMAIL=eric@demo.yomizaka.test
        E2E_PASSWORD=ci-only-demo-password-0123
