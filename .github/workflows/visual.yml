name: Visual regression

# The main journeys (landing, pricing, sign-in, signed-in home, a document report; desktop + phone, light + dark, and the first
# paint of a signed-in page) compared to their Linux baselines, as the seeded cast (krizaka/.github#375). The pipeline is the org's.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    uses: krizaka/.github/.github/workflows/visual-regression.yml@b53d9fa9dc1c759d7a27709059dc99f867c63e5b # main
    permissions:
      contents: read
    with:
      package-manager: pnpm
      # A docs, workflow, mobile, desktop or backend-only change does not queue the browser job (krizaka/.github#437).
      relevant: '^(apps/web/|packages/|scripts/ci-visual|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/visual\.yml$)'
      start-script: scripts/ci-visual-start.sh
      test-command: pnpm exec playwright test -c apps/web/e2e/visual/playwright.config.mjs
      snapshot-paths: apps/web/e2e/visual/__screenshots__
      env: |
        E2E_EMAIL=eric@demo.yomizaka.test
        E2E_PASSWORD=ci-only-demo-password-0123
