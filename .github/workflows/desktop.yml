# The Mac app (apps/desktop): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/core/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull request: unsigned check and build, no secret (the shared workflow refuses one with sign: false).
  desktop-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@cf1e598a446ed2d4d98b98a67ec9795c0f80100d # main
    with:
      working-directory: apps/desktop
      product-name: Yomizaka
      sign: false

  # Tag: signed and notarised in the `release` environment, the secrets passed by name.
  desktop-release:
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@cf1e598a446ed2d4d98b98a67ec9795c0f80100d # main
    with:
      working-directory: apps/desktop
      product-name: Yomizaka
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
