# The Mac app (apps/desktop): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/core/**"
      - "scripts/desktop-journey*"
      - ".github/actions/desktop-journey/**"
      - ".github/workflows/desktop.yml"
  # The Mac journey reads the `dev` environment, which only protected branches may use (as the dev smoke): main and by hand.
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/core/**"
      - "scripts/desktop-journey*"
      - ".github/actions/desktop-journey/**"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull request: unsigned check and build, no secret (the shared workflow refuses one with sign: false).
  desktop-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@846777a2acdd57fe91d2d5eb1fb0e36dfa3d57ab # main
    with:
      working-directory: apps/desktop
      product-name: Yomizaka
      sign: false

  # Main and by hand: the Mac journey (yomizaka#636): the app with its test driver, the dev persona, a folder pre-granted, one real
  # lease checked, a relaunch. Real engine and the deployed dev (as the dev smoke): the secrets of the `dev` environment.
  desktop-journey:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Mac journey
    runs-on: macos-latest
    timeout-minutes: 40
    environment: dev
    permissions:
      contents: read
    env:
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop-journey
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-journey
          path: desktop-journey
          retention-days: 7

  # Tag: signed and notarised in the `release` environment, the secrets passed by name.
  desktop-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@846777a2acdd57fe91d2d5eb1fb0e36dfa3d57ab # main
    with:
      working-directory: apps/desktop
      product-name: Yomizaka
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
