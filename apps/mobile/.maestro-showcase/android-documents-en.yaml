# The phone video of the download page (krizaka/.github#315): the signed-in space as the demo persona Éric, ~15 s, in English (the emulator
# and the seeded fixtures are English: the clip is android-documents-en, shown on /en only, yomizaka#1968).
# NOT a required flow: it lives in .maestro-showcase, run by the « Download page videos » jobs of download-videos.yml on main.
# The sign-in happens before the recording starts (nothing typed is filmed); the build is the showcase one (no development notice).
# The film ends on a result (a collection and its documents), never on an empty or an error state: the asserts below fail the flow
# rather than publish one. « Run a check » needs the Orazaka engine, which the CI backend does not have: it is not shown.
appId: com.krizaka.yomizaka
---
- runFlow: ../.maestro/shared/launch.yaml
- runFlow: ../.maestro/shared/sign-in.yaml
- assertVisible: "Check a document"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Rosemont building"
    timeout: 30000
- assertNotVisible: "No batch yet.*"
- startRecording: android-documents-en
- waitForAnimationToEnd
# Only scrollUntilVisible: a bare scroll first pushed the second collection past the screen and the flow never found it (run 41085183044).
- scrollUntilVisible:
    element: "Invoices 2026"
- tapOn: "Rosemont building"
- extendedWaitUntil:
    visible: ".*Rosemont.*"
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: ".*(No document|Something went wrong|Try again).*"
- stopRecording
