# Shared step (in shared/, so `maestro test .maestro` does not run it as a flow): signs in when the sign-in screen is there. The Keychain survives a
# reinstall, so a session may already exist.
appId: com.krizaka.yomizaka
---
# A blank first frame must not read as "signed in": wait for the sign-in or the signed-in screen before reading which.
- extendedWaitUntil:
    visible: "Se connecter|Sign in|Vérifier un document|Check a document"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: email
    commands:
      - tapOn:
          id: email
      - inputText: ${PERSONA_EMAIL}
      - hideKeyboard
      - tapOn:
          id: password
      - inputText: ${PERSONA_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: submit
- extendedWaitUntil:
    notVisible:
      id: submit
    timeout: 30000
