# The core journey on a simulator: sign in, pick a PDF in Files, the check runs, the result and its closing note.
# maestro test -e PERSONA_EMAIL=… -e PERSONA_PASSWORD=… .maestro/check-document.yaml   (the persona's, never a QA account)
appId: com.krizaka.yomizaka
# `manual`: it runs a paid engine check and picks the PDF by position in the iOS system picker, so mobile-e2e.yml leaves it out.
tags:
  - manual
---
- runFlow: shared/launch.yaml
- runFlow: shared/sign-in.yaml
- assertVisible: "Vérifier un document"
- tapOn: "Choisir un PDF"
# the system picker is a remote view: Maestro taps it by position (the Browse tab)
- tapOn:
    point: "71%,94%"
- tapOn:
    point: "71%,94%"
- waitForAnimationToEnd
- tapOn:
    point: "29%,37%"
- waitForAnimationToEnd
- tapOn:
    point: "18%,29%"
- extendedWaitUntil:
    visible: "Vérification terminée"
    timeout: 120000
- scrollUntilVisible:
    element: "Partager le rapport signé (PDF)"
- tapOn: "Partager le rapport signé (PDF)"
- waitForAnimationToEnd
- takeScreenshot: share-sheet
