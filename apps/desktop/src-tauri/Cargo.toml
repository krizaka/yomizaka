[package]
name = "yomizaka-desktop"
version = "0.1.0"
description = "Yomizaka for the Mac: a library in a folder of your Mac, documents checked and never kept elsewhere"
authors = ["Krizaka"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "yomizaka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
krizaka-tauri-kit = { git = "https://github.com/krizaka/krizaka-tauri-kit", tag = "v0.1.0" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
